[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-metaharness"
version = "0.1.0"
description = "Standalone outer-loop Meta-Harness orchestration for Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Mary Liu"},
]
keywords = ["llm", "agents", "harness", "evaluation", "search", "hermes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "filelock>=3.16",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "numpy>=1.24",
    "rich>=13.0",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
]

[project.urls]
Homepage = "https://github.com/howdymary/hermes-agent-metaharness"
Repository = "https://github.com/howdymary/hermes-agent-metaharness"
Issues = "https://github.com/howdymary/hermes-agent-metaharness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.25",
]
# Runs voyage-4-nano on this machine: no API key, no per-token cost, and no
# source code leaving the host. Optional because it pulls torch (~5 GB
# installed) and only repository indexing needs it.
# transformers is pinned below 5 because the model ships its own modelling
# code written against the 4.x registration API.
local-embeddings = [
    "sentence-transformers>=5.0",
    "transformers>=4.51,<5",
]

[project.scripts]
meta-harness = "meta_harness.cli:main"

[tool.setuptools.packages.find]
include = ["meta_harness*"]

[tool.setuptools.package-data]
"meta_harness.webapp" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
