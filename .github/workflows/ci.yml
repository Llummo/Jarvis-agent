name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build and smoke-test wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/metaharness-wheel
          /tmp/metaharness-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/metaharness-wheel/bin/python -c "import meta_harness"
          /tmp/metaharness-wheel/bin/meta-harness --help
